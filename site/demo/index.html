<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Shop · Bug2Test</title>
    <style>
      :root { --bg: #fafafa; --fg: #1f2328; --muted: #59636e; --card: #fff; --line: #e5e7eb; --accent: #7c3aed; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --card: #161b22; --line: #30363d; --accent: #a78bfa; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      main { max-width: 760px; margin: 0 auto; padding: 16px; }
      .note { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      ul { list-style: none; padding: 0; margin: 0; }
      li.item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); gap: 8px; }
      output { font-weight: 700; font-size: 18px; }
      input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); width: 100%; }
      label { display: block; margin-top: 8px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <strong>🛍️ Demo Shop</strong>
      <a href="../">← Bug2Test home</a>
    </header>
    <main>
      <p class="note">
        This shop has <b>planted bugs</b> for trying Bug2Test. Try: remove one item from the cart. The total should go
        down, but it does not. Add <code>?fixed</code> to the URL to see the fixed version.
      </p>

      <h2>Products</h2>
      <div class="grid" id="products"></div>

      <h2>Cart</h2>
      <div class="card">
        <ul id="cart"></ul>
        <p>Total: <output id="total" aria-label="Cart total">₹0</output></p>
      </div>

      <h2>Checkout</h2>
      <form class="card" id="checkout">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" />
        <label for="coupon">Coupon</label>
        <input id="coupon" name="coupon" placeholder="Try SAVE10" />
        <p id="coupon-msg" role="status" aria-label="Coupon message"></p>
        <button class="primary" type="submit">Place order</button>
      </form>
    </main>
    <script src="./shop.js"></script>
  </body>
</html>
